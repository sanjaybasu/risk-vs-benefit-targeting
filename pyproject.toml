[project]
name = "system-three"
version = "0.1.0"
description = "System Three: a typed contract, an open model, and a benchmark for the effect of an action against a reference action."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pyyaml>=6",
  "pyreadr>=0.5",
  "pyreadstat>=1.2",
  "requests>=2.31",
  "datasets>=2.19",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_three"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E731"]
